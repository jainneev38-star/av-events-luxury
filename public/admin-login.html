<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AV EVENTS ADMIN LOGIN</title><link rel="stylesheet" href="admin.css"></head><body><main class="login"><h1>AV EVENTS ADMIN</h1><p>Secure administrator login</p><form id="f"><input id="pw" type="password" placeholder="Admin password" required><button>LOGIN</button><p id="m"></p></form></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw.value})}),d=await r.json();if(r.ok)location='/admin.html';else m.textContent=d.error||'Login failed'}</script></body></html>
